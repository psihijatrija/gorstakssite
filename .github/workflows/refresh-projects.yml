name: Refresh projects.json

# DISABLED automatic triggers.
#
# projects.json is a hand-curated list (name, short/long descriptions,
# category, key) that the site UI depends on. The fetch script below writes a
# different, raw GitHub-API schema, so running it automatically would clobber
# the curated content. This workflow is kept for reference / manual use only
# and must be dispatched by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-projects
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/fetch-projects.js
          git add projects.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(site): refresh projects.json"
            git push
          fi
